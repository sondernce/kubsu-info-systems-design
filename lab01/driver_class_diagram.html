<style>
#cd svg.classDiagram .divider path { stroke-opacity: 0.5; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
    class DriverShort {
        -int id
        -string lastName
        -string initials
        +NewDriverShort(id, lastName, firstName, middleName) (*DriverShort, error)
        +ID() int
        +LastName() string
        +Initials() string
        +ShortString() string
    }

    class Driver {
        -string firstName
        -string middleName
        -int experience
        +NewDriver(id, lastName, firstName, middleName, exp) (*Driver, error)
        +NewDriverFromString(s) (*Driver, error)
        +NewDriverFromJSON(jsonData) (*Driver, error)
        +FirstName() string
        +MiddleName() string
        +Experience() int
        +String() string
        +Equals(other) bool
    }

    Driver *-- DriverShort : embeds (composition)`;
const { svg } = await mermaid.render('cd-svg', src);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg.classDiagram .node rect, #cd svg.classDiagram g.classGroup rect').forEach(r => {
  r.setAttribute('rx', '8');
});
</script>
